; Konfigurasi PHP untuk TTE PATROL ENGINE (container).
date.timezone = Asia/Jakarta
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 50
display_errors = Off
log_errors = On
error_log = /dev/stderr
max_input_vars = 5000
